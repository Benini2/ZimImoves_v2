<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/logo-icone-arredondado.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/images/logo-icone-arredondado.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>Zim Imóveis</title>

    <meta
      name="description"
      content="Encontre o imóvel ideal com a Zim Imóveis. Imóveis selecionados, atendimento personalizado e as melhores oportunidades do mercado."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zim Imóveis" />
    <meta
      property="og:description"
      content="Encontre o imóvel ideal com a Zim Imóveis. Imóveis selecionados, atendimento personalizado e as melhores oportunidades do mercado."
    />
    <meta
      property="og:image"
      content="https://zimimoveis.com.br/images/logo-icone-arredondado.svg"
    />
    <meta property="og:url" content="https://zimimoveis.com.br/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Zim Imóveis" />
    <meta
      name="twitter:description"
      content="Encontre o imóvel ideal com a Zim Imóveis."
    />
    <meta
      name="twitter:image"
      content="https://zimimoveis.com.br/images/logo-icone-arredondado.svg"
    />

    <!-- Dados estruturados da empresa -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "Zim Imóveis",
        "url": "https://zimimoveis.com.br/",
        "logo": "https://zimimoveis.com.br/images/logo-icone-arredondado.svg"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
